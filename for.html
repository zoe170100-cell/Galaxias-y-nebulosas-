<header>
  <marquee behavior="ALTERNATE">
  <div class="linea">
    <span> <h3> CONTACTO </h3> </span>
  </div>
  <img src="Ga2.jpg" class="izquierda" alt="Mi imagen">
  <h3> Galaxias y </h3>

</header>
<body>
  <h1>
    FORMULARIO
  </h1>
<body>
  <form class="formulario">
    <div class="campo-peque">
      <label>Nombre:</label>
      <input type="text" name="nombre">
    </div>

    <div class="campo-peque">
      <label>Correo Electronico:</label>
      <input type="email" name="correo">
    </div>

    <div class="campo-grande">
      <label>¿Cómo Te Parecio Este Tema?</label>
      <textarea rows="3"></textarea>
    </div>

    <div class="campo-grande">
      <label>¿Qué Piensas Que Puedo Mejorar?</label>
      <textarea rows="3"></textarea>
    </div>

    <div class="campo-grande">
      <label>¿Qué Deseas Saber Más Acerca del Tema?</label>
      <textarea rows="3"></textarea>
    </div>

    <div class="botones">
      <button type="submit" class="btn-enviar">Enviar!!</button>
      <a href="contacto.html" class="btn-regresar">Regresar!</a>
    </div>
  </form>
  
<footer class="pie">
    <div class="datos"> <marquee> Gracias Por Visitar Mi Pagina 🚀 </marque> </div>
  </footer>
</body>
