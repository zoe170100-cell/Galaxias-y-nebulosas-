<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="estilo.css"/>
  <title>CALIFICAME</title>
</head>
<header>
  <marquee behavior="ALTERNATE">
  <div class="linea">
    <span> <h3> CONTACTO </h3> </span>
  </div>
  <img src="Ga2.jpg" class="izquierda" alt="Mi imagen">
  <h3> Galaxias y </h3>
  <h3> Nebulosas </h3>
  </marquee>
</header>
<body>
  <h1>
    CALIFICAME
  </h1>

  <div class="contenedor-estrellas">
    <span class="estrella" data-valor="1">☆</span>
    <span class="estrella" data-valor="2">☆</span>
    <span class="estrella" data-valor="3">☆</span>
    <span class="estrella" data-valor="4">☆</span>
    <span class="estrella" data-valor="5">☆</span>
  </div>

  <p class="mensaje-gracias">Gracias Por Calificarme, Mejorare!!</p>

  <div class="contenedor-boton">
    <a href="contacto.html" class="btn-regresar">Regresar!</a>
  </div>

  <script>
  const estrellas = document.querySelectorAll('.estrella');
  estrellas.forEach(est => {
    est.addEventListener('click', () => {
      const valor = est.dataset.valor;
      estrellas.forEach((e, i) => {
        if (i < valor) {
          e.textContent = '★';
          e.classList.add('activa');
        } else {
          e.textContent = '☆';
          e.classList.remove('activa');
        }
      });
    });
  });
</script>

  <footer class="pie">
    <div class="datos"> <marquee> Gracias Por Visitar Mi Pagina 🚀 </marque> </div>
  </footer>
</body>
</html>
